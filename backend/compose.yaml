services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kimetabi
      POSTGRES_USER: kimetabi
      POSTGRES_PASSWORD: kimetabi
    ports:
      - "5432:5432"
    volumes:
      - kimetabi-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kimetabi -d kimetabi"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  kimetabi-postgres:
