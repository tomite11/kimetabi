name: Frontend

on:
  pull_request:
    paths:
      - "backend/**"
      - "firebase.json"
      - "frontend/**"
      - "openapi/**"
      - ".github/workflows/frontend.yml"
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "firebase.json"
      - "frontend/**"
      - "openapi/**"
      - ".github/workflows/frontend.yml"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  integration-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: kimetabi
          POSTGRES_USER: kimetabi
          POSTGRES_PASSWORD: kimetabi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kimetabi -d kimetabi"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:integration
        env:
          E2E_DATABASE_PORT: "5432"
